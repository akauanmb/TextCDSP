<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TextCDSP - Biblioteca</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div id="faixa-arquivo" class="faixa" role="alert" hidden>
    <span id="faixa-arquivo-texto"></span>
    <button id="faixa-arquivo-abrir" type="button">Abrir arquivo</button>
  </div>

  <div class="app">
    <aside class="lateral" aria-label="Lista de snippets">
      <div class="busca">
        <input id="busca" type="search" spellcheck="false" autocomplete="off" placeholder="Buscar atalho, nome, pasta ou texto (Ctrl+F)" aria-label="Buscar snippets">
      </div>
      <button id="novo" type="button" class="principal">Novo atalho pessoal</button>
      <ul id="lista" role="tree" aria-label="Snippets"></ul>
    </aside>

    <main id="painel" class="painel" aria-live="polite"></main>
  </div>

  <footer id="rodape" class="rodape"></footer>

  <script src="../../shared/busca.js"></script>
  <script src="../../shared/arvore.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
